name: Build Contacts APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform scaffolding
        run: flutter create --platforms=android --org com.hyouka56 --project-name contacts_flutter .
      - name: Disable Gradle file watching in CI
        run: |
          printf '\n# Avoid duplicate file-watch paths on ephemeral CI runners.\norg.gradle.vfs.watch=false\n' >> android/gradle.properties
      - name: Restore app tests
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:contacts_flutter/main.dart';
          
          void main() {
            testWidgets('Dialer shows keypad and minimal navigation', (tester) async {
              await tester.pumpWidget(const ContactsApp());
              expect(find.text('Dialer'), findsOneWidget);
              expect(find.text('Recents'), findsOneWidget);
              expect(find.text('Contacts'), findsOneWidget);
              for (final digit in ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#']) {
                expect(find.byKey(ValueKey('dialer-key-$digit')), findsOneWidget);
              }
            });
          
            testWidgets('Dialer accepts digits and deletes the last digit', (tester) async {
              await tester.pumpWidget(const ContactsApp());
              await tester.tap(find.byKey(const ValueKey('dialer-key-1')));
              await tester.tap(find.byKey(const ValueKey('dialer-key-2')));
              await tester.pump();
              var field = tester.widget<TextField>(find.byKey(const ValueKey('dialer-number')));
              expect(field.controller!.text, '12');
              await tester.tap(find.byTooltip('Delete last digit'));
              await tester.pump();
              field = tester.widget<TextField>(find.byKey(const ValueKey('dialer-number')));
              expect(field.controller!.text, '1');
            });
          
            testWidgets('Add contact form validates name and phone number', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: AddContactPage()));
              expect(find.byKey(const ValueKey('contact-name')), findsOneWidget);
              expect(find.byKey(const ValueKey('contact-phone')), findsOneWidget);
              await tester.tap(find.byKey(const ValueKey('save-contact')));
              await tester.pump();
              expect(find.text('Enter a name'), findsOneWidget);
              expect(find.text('Enter a phone number'), findsOneWidget);
            });
          }
          EOF
      - name: Set app label and contacts permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.READ_CONTACTS"/>',
              '<uses-permission android:name="android.permission.WRITE_CONTACTS"/>',
              '<uses-permission android:name="android.permission.READ_CALL_LOG"/>',
              '<uses-permission android:name="android.permission.READ_PHONE_NUMBERS"/>',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          if '<queries>' not in s:
              queries = '<queries><intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent></queries>'
              s = s.replace('<application', queries + chr(10) + '    <application', 1)
          s, label_count = re.subn(
              r'(<application\b[^>]*\bandroid:label=")[^"]*(")',
              r'\1Contacts\2',
              s,
              count=1,
              flags=re.S,
          )
          if label_count == 0:
              s = s.replace('<application', '<application android:label="Contacts"', 1)
          p.write_text(s)

          # call_log uses Java APIs that require core-library desugaring.
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          build_file = kts if kts.exists() else groovy
          if not build_file.exists():
              raise SystemExit('Could not find android/app/build.gradle(.kts)')
          gradle = build_file.read_text()
          is_kts = build_file.suffix == '.kts'
          enabled_line = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          if 'isCoreLibraryDesugaringEnabled' not in gradle and 'coreLibraryDesugaringEnabled' not in gradle:
              gradle, count = re.subn(r'(compileOptions\s*\{)', r'\1\n        ' + enabled_line, gradle, count=1)
              if count != 1:
                  raise SystemExit('Could not enable core library desugaring')
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if 'coreLibraryDesugaring(' not in gradle and 'coreLibraryDesugaring ' not in gradle:
              gradle, count = re.subn(r'(dependencies\s*\{)', r'\1\n    ' + dependency, gradle, count=1)
              if count != 1:
                  raise SystemExit('Could not add core library desugaring dependency')
          build_file.write_text(gradle)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Upload resolved dependency lockfile for audit
        uses: actions/upload-artifact@v7
        with:
          name: contacts-pubspec-lock
          path: pubspec.lock
          retention-days: 7
      - name: Generate launcher icons
        run: dart run launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build arm64-v8a APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK is arm64-v8a only
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not apk.is_file():
              raise SystemExit(f'APK not found: {apk}')
          with zipfile.ZipFile(apk) as archive:
              abis = sorted({
                  name.split('/')[1]
                  for name in archive.namelist()
                  if name.startswith('lib/') and len(name.split('/')) > 2
              })
          print('Native ABIs included:', ', '.join(abis) if abis else '(none found)')
          if abis != ['arm64-v8a']:
              raise SystemExit(f'Expected only arm64-v8a, found: {abis}')
          print(f'PASS: {apk} contains arm64-v8a native libraries only')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: contacts-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
