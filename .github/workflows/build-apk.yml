name: Build Contacts APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform scaffolding
        run: flutter create --platforms=android --org com.hyouka56 --project-name contacts_flutter .
      - name: Disable Gradle file watching in CI
        run: |
          printf '\n# Avoid duplicate file-watch paths on ephemeral CI runners.\norg.gradle.vfs.watch=false\n' >> android/gradle.properties
      - name: Restore app test
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:contacts_flutter/main.dart';

          void main() {
            testWidgets('Contacts shows add button and no top refresh button', (tester) async {
              await tester.pumpWidget(const ContactsApp());
              expect(find.text('Contacts'), findsOneWidget);
              expect(find.byTooltip('Add contact'), findsOneWidget);
              expect(find.byTooltip('Refresh contacts'), findsNothing);
            });
          }
          EOF
      - name: Set app label and contacts permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.READ_CONTACTS"/>'
          if perm not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          s, label_count = re.subn(
              r'(<application\b[^>]*\bandroid:label=")[^"]*(")',
              r'\1Contacts\2',
              s,
              count=1,
              flags=re.S,
          )
          if label_count == 0:
              s = s.replace('<application', '<application android:label="Contacts"', 1)
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build arm64-v8a APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK is arm64-v8a only
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not apk.is_file():
              raise SystemExit(f'APK not found: {apk}')
          with zipfile.ZipFile(apk) as archive:
              abis = sorted({
                  name.split('/')[1]
                  for name in archive.namelist()
                  if name.startswith('lib/') and len(name.split('/')) > 2
              })
          print('Native ABIs included:', ', '.join(abis) if abis else '(none found)')
          if abis != ['arm64-v8a']:
              raise SystemExit(f'Expected only arm64-v8a, found: {abis}')
          print(f'PASS: {apk} contains arm64-v8a native libraries only')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: contacts-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
