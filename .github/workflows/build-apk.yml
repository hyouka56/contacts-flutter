name: Build Contacts APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform scaffolding
        run: flutter create --platforms=android --org com.hyouka56 --project-name contacts_flutter .
      - name: Disable Gradle file watching in CI
        run: |
          printf '\n# Avoid duplicate file-watch paths on ephemeral CI runners.\norg.gradle.vfs.watch=false\n' >> android/gradle.properties
      - name: Restore app tests
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:contacts_flutter/main.dart';

          void main() {
            test('phone formatting is removed and a tel URI preserves the international prefix', () {
              final number = normalizePhoneNumber(' +20 (100) 123-45–67 ');
              expect(number, '+201001234567');
              expect(Uri(scheme: 'tel', path: number).toString(), 'tel:+201001234567');
            });

            testWidgets('App opens directly to contacts only', (tester) async {
              await tester.pumpWidget(const ContactsApp());
              await tester.pump();
              expect(find.text('Contacts'), findsOneWidget);
              expect(find.text('Dialer'), findsNothing);
              expect(find.text('Recents'), findsNothing);
              expect(find.byKey(const ValueKey('dialer-number')), findsNothing);
            });

            testWidgets('Add contact form validates name and phone number', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: AddContactPage()));
              expect(find.byKey(const ValueKey('contact-name')), findsOneWidget);
              expect(find.byKey(const ValueKey('contact-phone')), findsOneWidget);
              await tester.tap(find.byKey(const ValueKey('save-contact')));
              await tester.pump();
              expect(find.text('Enter a name'), findsOneWidget);
              expect(find.text('Enter a phone number'), findsOneWidget);
            });
          }
          EOF
      - name: Set app label and contacts permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.READ_CONTACTS"/>',
              '<uses-permission android:name="android.permission.WRITE_CONTACTS"/>',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          dial_intent_query = '<intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>'
          if '<queries>' in s:
              if 'android.intent.action.DIAL' not in s:
                  s = s.replace('</queries>', '        ' + dial_intent_query + chr(10) + '    </queries>', 1)
          else:
              queries = '<queries>' + dial_intent_query + '</queries>'
              s = s.replace('<application', queries + chr(10) + '    <application', 1)
          if 'android.intent.action.DIAL' not in s or 'android:scheme="tel"' not in s:
              raise SystemExit('Could not configure Android dialer intent query')
          s, label_count = re.subn(
              r'(<application\b[^>]*\bandroid:label=")[^"]*(")',
              r'\1Contacts\2',
              s,
              count=1,
              flags=re.S,
          )
          if label_count == 0:
              s = s.replace('<application', '<application android:label="Contacts"', 1)
          p.write_text(s)

          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Upload resolved dependency lockfile for audit
        uses: actions/upload-artifact@v7
        with:
          name: contacts-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Generate launcher icons
        run: dart run launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build arm64-v8a APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK is arm64-v8a only
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not apk.is_file():
              raise SystemExit(f'APK not found: {apk}')
          with zipfile.ZipFile(apk) as archive:
              abis = sorted({
                  name.split('/')[1]
                  for name in archive.namelist()
                  if name.startswith('lib/') and len(name.split('/')) > 2
              })
          print('Native ABIs included:', ', '.join(abis) if abis else '(none found)')
          if abis != ['arm64-v8a']:
              raise SystemExit(f'Expected only arm64-v8a, found: {abis}')
          print(f'PASS: {apk} contains arm64-v8a native libraries only')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: contacts-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
