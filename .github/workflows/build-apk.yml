name: Build Contacts APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform scaffolding
        run: flutter create --platforms=android --org com.hyouka56 --project-name contacts_flutter .
      - name: Restore app test
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:contacts_flutter/main.dart';

          void main() {
            testWidgets('Contacts app renders its title', (tester) async {
              await tester.pumpWidget(const ContactsApp());
              expect(find.text('Contacts'), findsOneWidget);
            });
          }
          EOF
      - name: Restore contacts permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.READ_CONTACTS"/>'
          if perm not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: contacts-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
